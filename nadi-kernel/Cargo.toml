[package]
name = "nadi-kernel"
version = "0.1.0"
edition = "2024"
description = "Jupyter Kernel Protocol for NADI"

[dependencies]
nadi_core = {path="../nadi_core/", version="0.8.0", features=["functions", "parser"]}
clap = { version = "4.6.1", features = ["derive"] }
jupyter-protocol = "1.4.0"
tokio = { version = "1.52.1", features = ["fs", "full"] }
anyhow = "1.0.102"
runtimelib = { version = "1.6.0", features=["tokio-runtime", "ring"] }
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0.149"
futures = "0.3.32"
uuid = "1.23.1"
